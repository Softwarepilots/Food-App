name: foodapp_customer
description: "Garuda — Karaikal's food delivery platform (customer app)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Value equality without code generation
  equatable: ^2.0.7

  # Formatting (currency, dates)
  intl: ^0.19.0

  # Images
  cached_network_image: ^3.4.1

  # Brand typography (Poppins)
  google_fonts: ^6.2.1

  # Connectivity awareness
  connectivity_plus: ^6.1.1

  # Loading skeletons
  shimmer: ^3.0.0

  # Local cart line-item identifiers
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# path_provider_android (via google_fonts) pulls in package:jni, whose
# Android Gradle module has a broken externalNativeBuild/CMake config that
# fails `:jni:compileDebugJavaWithJavac` with "Cannot query the value of
# this provider" on any real-device or universal-APK debug build — confirmed
# present in both 1.0.0 and 1.0.3, and unaffected by NDK/SDK reinstalls or
# ABI-filter workarounds. Pinning path_provider_android to the last release
# before it migrated to package:jni sidesteps the broken module entirely.
dependency_overrides:
  path_provider_android: 2.2.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
